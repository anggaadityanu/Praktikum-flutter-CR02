name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pertemuan14/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pertemuan14/backend/requirements-dev.txt
      - name: Pasang dependensi
        run: |
          pip install -r requirements-dev.txt
          pip install ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Test + coverage
        run: pytest --cov --cov-report=term-missing

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pertemuan14/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.3"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    needs: [backend, mobile]
    steps:
      - uses: actions/checkout@v4
      - name: Build image API (produksi)
        run: docker build --build-arg INSTALL_DEV=false -t tabungku-api:ci pertemuan14/backend
      - name: Build image Admin (produksi)
        run: docker build --build-arg COMPOSER_NO_DEV=1 -t tabungku-admin:ci pertemuan14/admin
